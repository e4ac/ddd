name: CICD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Format
        run: cargo fmt --all --check --quiet
      - name: Check Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: Test
    needs: [analysis]
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run Tests
        run: cargo test --all-features --all-targets
